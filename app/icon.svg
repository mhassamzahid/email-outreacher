<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Coldbrew: ripples spreading from one centre, and one message leaving them.
       Light: indigo with white ripples. Dark: midnight with electric violet. Sun yellow in both. -->
  <style>
    .disc { fill: #4338ca }
    .ring { stroke: #ffffff }
    .outer { stroke: #a5b4fc }
    .centre, .dot { fill: #fde047 }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #0a0a12 }
      .ring, .outer { stroke: #8b5cf6 }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="30"/>
  <path class="ring" d="M44.6 25.5 A14 14 0 1 1 39 19.9" fill="none" stroke-width="3.6" stroke-linecap="round"/>
  <path class="outer" d="M51.3 21.5 A22 22 0 1 1 44.2 13.4" fill="none" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
  <circle class="centre" cx="32" cy="32" r="5"/>
  <circle class="dot" cx="50" cy="14" r="4.5"/>
</svg>
